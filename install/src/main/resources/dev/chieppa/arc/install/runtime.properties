# The JetBrains Runtime Arc installs itself on, pinned by version and by each archive's SHA-256. Plain JBR, without
# JCEF: nothing Arc ships draws web pages. The version matches the one Gradle provisions for :app:run. Arc downloads
# it for its host into runtimes/jbr-<version> in the data folder when it installs itself. Each host names the
# archive's url, its sha256 and the java program inside it.

